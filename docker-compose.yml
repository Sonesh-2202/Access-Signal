# Full stack with PostGIS:  docker compose up --build
# Then seed once:           docker compose exec backend python -m scripts.seed_demo --reset
# App: http://localhost:3000   API docs: http://localhost:3000/api/docs
#
# AI runs in the cloud. Put provider keys in the host environment or a root .env file;
# with no keys set, the classifier uses keyword rules and the assistant is offline.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: accesssignal
      POSTGRES_PASSWORD: accesssignal
      POSTGRES_DB: accesssignal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesssignal"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://accesssignal:accesssignal@db:5432/accesssignal
      SECRET_KEY: ${SECRET_KEY:-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-cloud}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
